  <body>
    <a class="skip-link" href="#pulse">Skip to Web Pulse</a>
    <!-- site-header -->

    <main id="pulse">
      <section class="pulse-page shell" id="pulse-overview">
        <h1>Nostr Web Pulse</h1>
        <p class="pulse-tagline">Discover what the Nostr community loves, zaps, and reacts to on the open web.</p>
        <div id="overview-stats"></div>
        <a class="pulse-banner" href="https://nostr-components.web.app/" target="_blank" rel="noopener noreferrer">
          Want to add ⚡ zap &amp; 👍 like buttons to your website? Check out <strong>Nostr Components</strong>
        </a>
        <section id="overview-activity" aria-live="polite"></section>
        <form class="pulse-search" id="domain-search" role="search">
          <label class="sr-only" for="domain-search-input">Search domains</label>
          <input id="domain-search-input" type="search" name="search" maxlength="253" autocomplete="off" placeholder="Search domains" />
          <button class="secondary-button" type="submit">Search</button>
        </form>
        <div id="domain-table"></div>
      </section>

      <section class="pulse-page shell" id="pulse-domain" hidden>
        <a class="pulse-back" href="/pulse/">Back to Web Pulse</a>
        <h1 id="domain-heading"></h1>
        <div id="domain-stats"></div>
        <div id="url-table"></div>
        <section id="domain-activity" aria-live="polite"></section>
      </section>
    </main>

    <!-- site-footer -->
    <noscript>Web Pulse needs JavaScript to load counts.</noscript>
    <script type="module" src="/src/pulse/main.ts"></script>
