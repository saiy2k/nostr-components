                <div data-hf-id="hf-s7ov" id="f02-zap-it-verb0"><svg data-hf-id="hf-mvdr" id="f02-zap-it-heart" viewBox="0.75 0 22.5 24" width="82.5" height="88" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-2bye" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></svg><span data-hf-id="hf-vsp9" id="f02-zap-it-verb0-word"><span data-hf-id="hf-ubzr">l</span><span data-hf-id="hf-wbiw">i</span><span data-hf-id="hf-viwu">k</span><span data-hf-id="hf-xwr0">e</span></span></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (name) { return document.getElementById("f02-zap-it-" + name); };
      var INK = "#0A0A0A";
      var CREAM = "#F0ECE5";
      var BOLT_YELLOW = "#FFC800";
      var tl = gsap.timeline({ paused: true });

      // Scene 1 — smooth character type-on. Every glyph is laid out up front and only its
      // opacity flips, so the centred lines never re-centre while typing.
      var line1 = byId("line1");
      var verb0Word = byId("verb0-word");
      var tail = byId("tail");
      var units = [].concat(
        Array.prototype.slice.call(line1.children),
        [byId("heart")],
        Array.prototype.slice.call(verb0Word.children),
        Array.prototype.slice.call(tail.children)
      );
      var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
      var typeEase = gsap.parseEase("power1.inOut");
      var stepEase = gsap.parseEase("expo.out");
      var slamEase = gsap.parseEase("power4.out");
      function applyTyping(t) {
        var shown = Math.floor(units.length * typeEase(clamp01(t / 0.4)));
        for (var i = 0; i < units.length; i++) units[i].style.opacity = i < shown ? "1" : "0";
      }

      // Scene 2 — the verb slot clicks over on the 0.5s and 1.0s beats. Summed per-step progress
      // drives the stack; each step is out-eased because this video allows no overshoot. The line
      // re-centres through a translate on the slot/tail join, never a layout property.
      var ITEM_H = 125;
      var stack = byId("stack");
      var join = byId("join");
      var verbs = [byId("verb0"), byId("verb1"), byId("verb2")];
      var verbW = [242, 378, 511];
      var tailW = 99;
      function measureLine2() {
        for (var k = 0; k < verbs.length; k++) {
          if (verbs[k].offsetWidth > 0) verbW[k] = verbs[k].offsetWidth;
        }
        if (tail.offsetWidth > 0) tailW = tail.offsetWidth;
      }
      function applyTicker(t) {
        var sum = stepEase(clamp01((t - 0.5) / 0.55)) + stepEase(clamp01((t - 1.0) / 0.55));
        var i = Math.min(Math.floor(sum), verbW.length - 2);
        var verbWidth = verbW[i] + (verbW[i + 1] - verbW[i]) * (sum - i);
        stack.style.transform = "translateY(" + (-sum * ITEM_H) + "px)";
        join.style.transform = "translateX(" + (verbWidth - tailW) / 2 + "px)";
      }
      measureLine2();

      // Scene 3–4 — one driver owns the collision: the bolt streaks in on a steep diagonal with a
      // velocity-coupled directional blur, touches the top of "don't just" at exactly 2.0s, the
      // register flips, the lead is shoved off left-down in proportion to the bolt's settle
      // (done by 2.2s), and the bolt lands heavy (power2) in its rest box by 2.5s.
      var T_IN = 1.6, T_HIT = 2.0, T_REST = 2.5, T_CLEAR = 2.2, RING_DUR = 0.3;
      var REST_X = 540, REST_Y = 330;
      var DIR_X = -0.53, DIR_Y = 0.848;
      var STREAK_AXIS = -58;
      var TIP_X = -33.333, TIP_Y = 166.667;
      var TILT_IN = 14, TILT_HIT = 3, SCALE_IN = 1.12, SCALE_HIT = 1.03;
      var CONTACT_Y = 362;
      var APPROACH = 760, END_SPEED = 0.5, PEAK_BLUR = 30;
      var SHOVE_X = -1050, SHOVE_Y = 680, SHOVE_ROT = -12;
      var RING_R0 = 16, RING_R1 = 300, RING_W = 6;

      function tipOffset(tilt, scale) {
        var a = tilt * Math.PI / 180;
        return {
          x: (TIP_X * Math.cos(a) - TIP_Y * Math.sin(a)) * scale,
          y: (TIP_X * Math.sin(a) + TIP_Y * Math.cos(a)) * scale
        };
      }
      function settleAt(t) {
        var k = Math.min(1, Math.max(0, (t - T_HIT) / (T_REST - T_HIT)));
        return 1 - (1 - k) * (1 - k);
      }
      var tipHit = tipOffset(TILT_HIT, SCALE_HIT);
      var SETTLE = (REST_Y + tipHit.y - CONTACT_Y) / DIR_Y;
      var HIT_X = REST_X - DIR_X * SETTLE;
      var HIT_Y = REST_Y - DIR_Y * SETTLE;
      var START_X = HIT_X - DIR_X * APPROACH;
      var START_Y = HIT_Y - DIR_Y * APPROACH;
      var BRAKE = (1 - END_SPEED) / 2;
      var SHOVE_DONE = settleAt(T_CLEAR);

      var strike = byId("strike");
      var lead = byId("lead");
      var ring = byId("ring-circle");
      var bolt = byId("bolt");
      var boltAxis = byId("bolt-axis");
      var boltSmear = byId("bolt-smear");
      var boltBody = byId("bolt-body");
      var boltPath = byId("bolt-path");
      var streakBlur = byId("streak-blur");
      ring.setAttribute("cx", (HIT_X + tipHit.x).toFixed(2));
      ring.setAttribute("cy", CONTACT_Y.toFixed(2));

      function renderCrash(time) {
        var t = Math.min(T_REST, Math.max(T_IN, time));
        var struck = t >= T_HIT;
        var x, y, tilt, scale;
        var blur = 0;
        if (struck) {
          var left = 1 - settleAt(t);
          x = REST_X + (HIT_X - REST_X) * left;
          y = REST_Y + (HIT_Y - REST_Y) * left;
          tilt = TILT_HIT * left;
          scale = 1 + (SCALE_HIT - 1) * left;
        } else {
          var k = Math.max(0, (t - T_IN) / (T_HIT - T_IN));
          var u = (k - BRAKE * k * k) / (1 - BRAKE);
          x = START_X + (HIT_X - START_X) * u;
          y = START_Y + (HIT_Y - START_Y) * u;
          tilt = TILT_IN + (TILT_HIT - TILT_IN) * u;
          scale = SCALE_IN + (SCALE_HIT - SCALE_IN) * u;
          blur = PEAK_BLUR * (1 - k);
        }

        var dx = x - REST_X;
        var dy = y - REST_Y;
        bolt.style.transform = dx || dy ? "translate(" + dx + "px, " + dy + "px)" : "none";
        if (blur > 0.05) {
          streakBlur.setAttribute("stdDeviation", blur.toFixed(2) + " 0");
          boltSmear.style.filter = 'url("#f02-zap-it-streak")';
          boltAxis.style.transform = "rotate(" + STREAK_AXIS + "deg)";
          boltBody.style.transform = "rotate(" + (tilt - STREAK_AXIS) + "deg) scale(" + scale + ")";
        } else {
          streakBlur.setAttribute("stdDeviation", "0 0");
          boltSmear.style.filter = "none";
          boltAxis.style.transform = "none";
          boltBody.style.transform = tilt || scale !== 1 ? "rotate(" + tilt + "deg) scale(" + scale + ")" : "none";
        }
        boltPath.setAttribute("fill", struck ? INK : BOLT_YELLOW);
        strike.style.opacity = struck ? "1" : "0";
        lead.style.color = struck ? INK : CREAM;

        var shove = struck ? Math.min(1, settleAt(t) / SHOVE_DONE) : 0;
        lead.style.transform = shove > 0
          ? "translate(" + SHOVE_X * shove + "px, " + SHOVE_Y * shove + "px) rotate(" + SHOVE_ROT * shove + "deg)"
          : "none";

        var ringK = (t - T_HIT) / RING_DUR;
        if (struck && ringK < 1) {
          ring.setAttribute("r", (RING_R0 + (RING_R1 - RING_R0) * (1 - (1 - ringK) * (1 - ringK))).toFixed(2));
          ring.setAttribute("stroke-width", (RING_W * (1 - ringK)).toFixed(2));
        } else {
          ring.setAttribute("r", "0");
          ring.setAttribute("stroke-width", "0");
        }
      }
      // Scene 4 — "zap it." slams on 2.5s (scale + blur), the kicker lands on 3.0s (rise); both are
      // at rest by 3.18s so 3.2–4.0s is the exact, dead-still handoff picture.
      var word = byId("word");
      function applyWordBlur(t) {
        var v = 16 * (1 - slamEase(clamp01((t - 2.5) / 0.5)));
        word.style.filter = v > 0.05 ? "blur(" + v.toFixed(2) + "px)" : "none";
      }

      // Every callback-driven state is a pure function of timeline time, written by one
      // full-duration driver, so any seek order lands on the same picture.
      function renderAt(t) {
        applyTyping(t);
        applyTicker(t);
        renderCrash(t);
        applyWordBlur(t);
      }
      var drv = { t: 0 };
      renderAt(0);
      tl.to(drv, { t: 4, duration: 4, ease: "none", onUpdate: function () { renderAt(drv.t); } }, 0);
      tl.fromTo(word, { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power4.out" }, 2.5);
      tl.fromTo(byId("kicker"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.18, ease: "circ.out" }, 3.0);
      // Widths are cached outside timeline callbacks; refresh them once the webfont is in.
      if (document.fonts && document.fonts.load) {
        document.fonts.load('900 100px "Barlow"').then(function () { measureLine2(); renderAt(tl.time()); }, function () {});
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["02-zap-it"] = tl;
    })();
  </script>
