  <script>
    const DURATION = 4.5;
    const tl = gsap.timeline({ paused: true });

    const mark = document.getElementById("f06-get-it-mark");
    const boltFill = document.getElementById("f06-get-it-bolt-fill");
    const boltHalves = [
      document.getElementById("f06-get-it-bolt-left"),
      document.getElementById("f06-get-it-bolt-right"),
    ];
    const words = Array.from(document.getElementById("f06-get-it-wordmark").children);
    const avail = document.getElementById("f06-get-it-avail");
    const urlText = document.getElementById("f06-get-it-url-text");
    const caret = document.getElementById("f06-get-it-caret");

    // 30.63 is the exact length of each half outline, used only if getTotalLength() returns 0.
    boltHalves.forEach((half) => {
      const len = half.getTotalLength() || 30.63;
      half.style.strokeDasharray = len + " " + len;
      half.style.strokeDashoffset = String(len);
      tl.fromTo(half, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0);
    });
    tl.fromTo(boltFill, { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.2, ease: "power1.out" }, 0.7);
    tl.fromTo(mark, { scale: 1.04 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 1.0);

    words.forEach((word, i) => {
      tl.fromTo(word, { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 1.0 + i * 0.2);
    });

    tl.fromTo(avail, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.0);

    const URL_TEXT = "github.com/saiy2k/nostr-components";
    const TYPE_START = 2.5;
    const TYPE_END = 3.2;
    const EPS = 1e-6;
    const SEQUENCE = [{ t: 0, text: "" }];
    for (let i = 1; i <= URL_TEXT.length; i++) {
      SEQUENCE.push({
        t: TYPE_START + ((i - 1) / (URL_TEXT.length - 1)) * (TYPE_END - TYPE_START),
        text: URL_TEXT.slice(0, i),
      });
    }
    function textAt(time) {
      for (let i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time + EPS >= SEQUENCE[i].t) return SEQUENCE[i].text;
      }
      return "";
    }
    const driver = { t: 0 };
    tl.to(
      driver,
      {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: () => {
          urlText.textContent = textAt(driver.t);
          caret.style.opacity = driver.t + EPS >= TYPE_START && driver.t + EPS < TYPE_END ? "1" : "0";
        },
      },
      0,
    );

    window.__timelines = window.__timelines || {};
    window.__timelines["06-get-it"] = tl;
  </script>
