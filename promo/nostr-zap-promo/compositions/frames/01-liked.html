  <script>
    window.__timelines = window.__timelines || {};

    const DURATION = 5;
    const BEAT = 0.5;
    const T_LIKE = BEAT;
    const WORD_BEATS = [2 * BEAT, 2.5 * BEAT, 3 * BEAT];
    const T_CUT = 5 * BEAT;
    const T_LIKES = 6 * BEAT;

    const X_GREY = "#71767B";
    const X_PINK = "#F91880";

    // Each state holds from its t until the next entry's t; swaps are instant.
    const SEQUENCE = [
      { t: 0, liked: false, count: "12,399", line: "a" },
      { t: T_LIKE, liked: true, count: "12,400", line: "a" },
      { t: T_CUT, liked: false, count: "12,400", line: "b" },
    ];

    function stateAt(time) {
      for (let i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time >= SEQUENCE[i].t) return SEQUENCE[i];
      }
      return SEQUENCE[0];
    }

    const heartOutline = document.querySelector(".f01-liked-heart-outline");
    const heartFilled = document.querySelector(".f01-liked-heart-filled");
    const countText = document.querySelector(".f01-liked-count-text");
    const lineA = document.querySelector(".f01-liked-line-a");
    const lineB = document.querySelector(".f01-liked-line-b");

    function renderState(time) {
      const s = stateAt(time);
      heartOutline.style.opacity = s.liked ? "0" : "1";
      heartFilled.style.opacity = s.liked ? "1" : "0";
      countText.textContent = s.count;
      countText.style.color = s.liked ? X_PINK : X_GREY;
      lineA.style.opacity = s.line === "a" ? "1" : "0";
      lineB.style.opacity = s.line === "b" ? "1" : "0";
    }

    const DOT_COUNT = 6;
    const DOT_X0 = [];
    const DOT_Y0 = [];
    const DOT_X1 = [];
    const DOT_Y1 = [];
    const DOT_S0 = [];
    for (let i = 0; i < DOT_COUNT; i++) {
      const deg = -90 + i * 60 + (((i * 7) % 5) - 2) * 4;
      const rad = (deg * Math.PI) / 180;
      const reach = 186 + (i % 3) * 12;
      DOT_X0.push(Math.cos(rad) * 60);
      DOT_Y0.push(Math.sin(rad) * 60);
      DOT_X1.push(Math.cos(rad) * reach);
      DOT_Y1.push(Math.sin(rad) * reach);
      DOT_S0.push(1 + (i % 2) * 0.25);
    }

    const tl = gsap.timeline({ paused: true });

    const driver = { t: 0 };
    tl.to(
      driver,
      {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: () => renderState(driver.t),
      },
      0,
    );

    tl.fromTo(
      ".f01-liked-heart",
      { scale: 1 },
      { scale: 0.85, duration: 0.1, ease: "power2.out" },
      T_LIKE,
    );
    // immediateRender:false keeps this tween's from-values off the heart until it starts.
    tl.fromTo(
      ".f01-liked-heart",
      { scale: 0.85 },
      { scale: 1, duration: 0.6, ease: "power3.out", immediateRender: false },
      T_LIKE + 0.1,
    );

    tl.fromTo(
      ".f01-liked-ring",
      { attr: { r: 56, "stroke-width": 8 } },
      { attr: { r: 158, "stroke-width": 1.5 }, duration: 0.4, ease: "power3.out" },
      T_LIKE,
    );
    tl.fromTo(
      ".f01-liked-ring",
      { opacity: 1 },
      { opacity: 0, duration: 0.4, ease: "power1.in", immediateRender: false },
      T_LIKE,
    );

    tl.fromTo(
      ".f01-liked-dot",
      { x: (i) => DOT_X0[i], y: (i) => DOT_Y0[i] },
      { x: (i) => DOT_X1[i], y: (i) => DOT_Y1[i], duration: 0.4, ease: "expo.out" },
      T_LIKE,
    );
    tl.fromTo(
      ".f01-liked-dot",
      { opacity: 1, scale: (i) => DOT_S0[i] },
      { opacity: 0, scale: 0.4, duration: 0.4, ease: "power2.in", immediateRender: false },
      T_LIKE,
    );

    tl.fromTo(
      ".f01-liked-w1",
      { opacity: 0, scale: 1.6, filter: "blur(10px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
      WORD_BEATS[0],
    );
    tl.fromTo(
      ".f01-liked-w2",
      { opacity: 0, y: -110 },
      { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" },
      WORD_BEATS[1],
    );
    tl.fromTo(
      ".f01-liked-w3",
      { opacity: 0, x: 150, rotation: 6 },
      { opacity: 1, x: 0, rotation: 0, duration: 0.45, ease: "circ.out" },
      WORD_BEATS[2],
    );

    tl.fromTo(
      ".f01-liked-q2",
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      T_LIKES,
    );

    (function (timeline) {
      var S = 30 / 27.65;
      timeline.getChildren(false, true, false).forEach(function (tw) {
        tw.startTime(tw.startTime() * S);
        tw.duration(tw.duration() * S);
      });
    })(tl);
    window.__timelines["01-liked"] = tl;
  </script>
